apply plugin: 'com.android.library'
apply from: 'publish.gradle'
group = 'com.github.VERO-Digital-Solutions'

android {
    namespace 'org.benjinus.pdfium'
    compileSdk = 36
    ndkVersion "29.0.13599879"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        ndk {
            abiFilters 'x86', 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
        externalNativeBuild {

            cmake {
                arguments "-DANDROID_STL=c++_static",
                        "-DANDROID_PLATFORM=android-21",
                        "-DANDROID_ARM_NEON=TRUE",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"

                cppFlags "-std=c++11 -frtti -fexceptions"
            }
        }
    }

    sourceSets {
        main {
            // let gradle pack the shared library into apk
            jniLibs.srcDirs = ['src/main/cpp/pdfium/lib']
            jni.srcDirs = [] // disable automatic ndk-build call
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/armeabi-v7a/libpdfsdk.so', 'lib/arm64-v8a/libpdfsdk.so', 'lib/x86/libpdfsdk.so', 'lib/x86_64/libpdfsdk.so']
        }
    }


    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
